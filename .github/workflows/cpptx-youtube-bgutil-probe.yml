name: Isolated yt-dlp BgUtils YouTube probe

on:
  push:
    branches:
      - tmp/cpptx-youtube-bgutil-probe-20260804
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp and BgUtils PO-token provider
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade 'yt-dlp[default,curl-cffi]' bgutil-ytdlp-pot-provider pillow
          docker run -d --init --name cpptx-bgutil -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider:latest
          for i in $(seq 1 45); do
            if (echo > /dev/tcp/127.0.0.1/4416) >/dev/null 2>&1; then break; fi
            sleep 2
          done
          yt-dlp --version
          deno --version

      - name: Download the actual 23:00-24:00 video segment
        shell: bash
        run: |
          set -uo pipefail
          ROOT='generated/youtube-7UXprjqSBvk-bgutil-probe'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/frames" "$ROOT/transfer"
          URL='https://www.youtube.com/watch?v=7UXprjqSBvk'
          OUT="$ROOT/segment.%(ext)s"
          : > "$ROOT/yt-dlp.log"

          run_attempt() {
            local label="$1"
            shift
            rm -f "$ROOT"/segment.* "$ROOT"/*.part "$ROOT"/*.ytdl
            echo "===== $label =====" | tee -a "$ROOT/yt-dlp.log"
            yt-dlp -v \
              --no-playlist \
              --js-runtimes deno \
              --remote-components ejs:github \
              --extractor-args 'youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416' \
              --download-sections '*00:23:00-00:24:00' \
              --force-keyframes-at-cuts \
              --format '18/b[height<=480]/bv[height<=480]' \
              --output "$OUT" \
              "$@" "$URL" 2>&1 | tee -a "$ROOT/yt-dlp.log"
            return ${PIPESTATUS[0]}
          }

          success=0
          run_attempt 'automatic client with BgUtils provider' && success=1
          if [[ $success -eq 0 ]]; then
            run_attempt 'web and mweb clients with BgUtils provider' \
              --extractor-args 'youtube:player_client=web,mweb;youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416' && success=1
          fi
          if [[ $success -eq 0 ]]; then
            run_attempt 'android and ios clients with BgUtils provider' \
              --extractor-args 'youtube:player_client=android,ios;youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416' && success=1
          fi

          SEGMENT=$(find "$ROOT" -maxdepth 1 -type f \( -name 'segment.mp4' -o -name 'segment.webm' -o -name 'segment.mkv' \) -size +100k | head -n 1 || true)
          if [[ -n "$SEGMENT" ]]; then
            ffprobe -v error -show_format -show_streams -of json "$SEGMENT" > "$ROOT/ffprobe.json"
            ffmpeg -y -i "$SEGMENT" -vf 'fps=1/10,scale=960:-2' -q:v 2 "$ROOT/frames/frame-%03d.jpg" > "$ROOT/frames.log" 2>&1
          fi

          cat > "$ROOT/package.py" <<'PY'
          import base64
          import hashlib
          import io
          import json
          import zipfile
          from pathlib import Path
          from PIL import Image, ImageDraw

          root = Path('generated/youtube-7UXprjqSBvk-bgutil-probe')
          frames = sorted((root/'frames').glob('*.jpg'))
          segment = next((p for p in root.glob('segment.*') if p.suffix in {'.mp4','.webm','.mkv'} and p.stat().st_size > 100000), None)
          result = {
              'status': 'segment_captured' if segment else 'failed',
              'video_id': '7UXprjqSBvk',
              'source_start_seconds': 1380,
              'source_end_seconds': 1440,
              'segment_file': segment.name if segment else None,
              'segment_bytes': segment.stat().st_size if segment else 0,
              'frame_count': len(frames),
          }
          if frames:
              thumb_w, thumb_h = 480, 270
              cols = 2
              rows = (len(frames)+cols-1)//cols
              sheet = Image.new('RGB',(thumb_w*cols,thumb_h*rows),'white')
              draw = ImageDraw.Draw(sheet)
              for i,path in enumerate(frames):
                  im=Image.open(path).convert('RGB').resize((thumb_w,thumb_h))
                  x=(i%cols)*thumb_w; y=(i//cols)*thumb_h
                  sheet.paste(im,(x,y)); draw.text((x+8,y+8),path.stem,fill='white',stroke_width=2,stroke_fill='black')
              sheet.save(root/'contact-sheet.jpg','JPEG',quality=88,optimize=True)
          (root/'result.json').write_text(json.dumps(result,indent=2),encoding='utf-8')

          payload=io.BytesIO()
          with zipfile.ZipFile(payload,'w',compression=zipfile.ZIP_DEFLATED) as zf:
              zf.write(root/'result.json','result.json')
              if (root/'ffprobe.json').exists(): zf.write(root/'ffprobe.json','ffprobe.json')
              if (root/'contact-sheet.jpg').exists(): zf.write(root/'contact-sheet.jpg','contact-sheet.jpg')
              for path in frames: zf.write(path,f'frames/{path.name}')
          raw=payload.getvalue(); encoded=base64.b64encode(raw).decode('ascii')
          chunk_size=6000
          parts=[encoded[i:i+chunk_size] for i in range(0,len(encoded),chunk_size)]
          for i,part in enumerate(parts):
              (root/'transfer'/f'part-{i:04d}.txt').write_text(part,encoding='ascii')
          (root/'transfer-manifest.json').write_text(json.dumps({
              'zip_bytes':len(raw),'base64_chars':len(encoded),'chunk_size':chunk_size,
              'chunk_count':len(parts),'sha256':hashlib.sha256(raw).hexdigest(),
              'parts':[f'part-{i:04d}.txt' for i in range(len(parts))]
          },indent=2),encoding='utf-8')
          PY
          python "$ROOT/package.py"
          docker logs cpptx-bgutil > "$ROOT/bgutil.log" 2>&1 || true
          docker rm -f cpptx-bgutil >/dev/null 2>&1 || true

      - name: Commit output
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated/youtube-7UXprjqSBvk-bgutil-probe
          git commit -m 'ci: probe actual YouTube segment with BgUtils PO token' || true
          git push origin HEAD:${GITHUB_REF_NAME}
