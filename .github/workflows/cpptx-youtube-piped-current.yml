name: Capture actual YouTube frames through current Piped instances

on:
  push:
    branches:
      - tmp/cpptx-youtube-piped-current-20260804
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/cpptx-youtube-piped-current.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pillow
          ffmpeg -version | head -n 3
      - name: Probe current official Piped instances and capture 23:00 onward
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/frames artifact/raw
          cat > artifact/capture.py <<'PY'
          import concurrent.futures
          import hashlib
          import json
          import math
          import re
          import subprocess
          import time
          from pathlib import Path
          from urllib.parse import urlparse

          import requests
          from PIL import Image, ImageDraw, ImageStat

          root = Path('artifact')
          raw_dir = root / 'raw'
          frames_dir = root / 'frames'
          video_id = '7UXprjqSBvk'
          source_url = f'https://www.youtube.com/watch?v={video_id}'
          start_s, end_s = 1380, 1740
          endpoints = [
              'https://pipedapi.kavin.rocks',
              'https://pipedapi.leptons.xyz',
              'https://pipedapi.nosebs.ru',
              'https://pipedapi-libre.kavin.rocks',
              'https://piped-api.privacy.com.de',
              'https://pipedapi.adminforge.de',
              'https://api.piped.yt',
              'https://pipedapi.drgns.space',
              'https://pipedapi.owo.si',
              'https://pipedapi.ducks.party',
              'https://piped-api.codespace.cz',
              'https://pipedapi.reallyaweso.me',
              'https://api.piped.private.coffee',
              'https://pipedapi.darkness.services',
              'https://pipedapi.orangenet.cc',
              # A few recently used/legacy endpoints that may still be live.
              'https://pipedapi.tokhmi.xyz',
              'https://pipedapi.moomoo.me',
              'https://pipedapi.syncpundit.io',
              'https://api-piped.mha.fi',
              'https://piped-api.garudalinux.org',
              'https://pipedapi.rivo.lol',
          ]
          ua = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36'

          def quality_height(stream):
              for key in ('height',):
                  value = stream.get(key)
                  if isinstance(value, (int, float)):
                      return int(value)
              label = str(stream.get('quality') or stream.get('qualityLabel') or '')
              match = re.search(r'(\d{3,4})', label)
              return int(match.group(1)) if match else 0

          def probe(endpoint):
              entry = {'endpoint': endpoint}
              session = requests.Session()
              session.headers.update({'User-Agent': ua, 'Accept': 'application/json'})
              started = time.time()
              try:
                  response = session.get(f'{endpoint}/streams/{video_id}', timeout=90)
                  entry.update({
                      'http_status': response.status_code,
                      'content_type': response.headers.get('content-type'),
                      'bytes': len(response.content),
                      'duration_seconds': round(time.time() - started, 3),
                      'body_prefix': response.text[:1200],
                  })
                  if response.status_code == 200:
                      data = response.json()
                      streams = [s for s in (data.get('videoStreams') or []) if isinstance(s, dict) and s.get('url')]
                      subtitles = data.get('subtitles') or []
                      entry.update({
                          'status': 'api_success',
                          'title': data.get('title'),
                          'duration': data.get('duration'),
                          'video_stream_count': len(streams),
                          'subtitle_count': len(subtitles),
                          'hls_present': bool(data.get('hls')),
                          'dash_present': bool(data.get('dash')),
                      })
                      candidates = []
                      for stream in streams:
                          height = quality_height(stream)
                          if 0 < height <= 720:
                              score = (
                                  1 if not stream.get('videoOnly') else 0,
                                  height,
                                  1 if 'mp4' in str(stream.get('mimeType') or stream.get('format') or '').lower() else 0,
                              )
                              candidates.append((score, stream))
                      if not candidates:
                          for stream in streams:
                              height = quality_height(stream)
                              score = (1 if not stream.get('videoOnly') else 0, -abs(height - 480), 0)
                              candidates.append((score, stream))
                      candidates.sort(key=lambda item: item[0], reverse=True)
                      media = []
                      for _, stream in candidates[:8]:
                          media.append({
                              'kind': 'video_stream',
                              'url': stream['url'],
                              'quality': stream.get('quality') or stream.get('qualityLabel'),
                              'height': quality_height(stream),
                              'videoOnly': stream.get('videoOnly'),
                              'mimeType': stream.get('mimeType') or stream.get('format'),
                          })
                      if data.get('hls'):
                          media.append({'kind': 'hls', 'url': data['hls']})
                      if data.get('dash'):
                          media.append({'kind': 'dash', 'url': data['dash']})
                      entry['media_candidates'] = media
                      # Preserve only non-expiring metadata in the public artifact.
                      entry['stream_summaries'] = [
                          {k: v for k, v in item.items() if k != 'url'} for item in media
                      ]
                      return entry, media
                  entry['status'] = 'api_failed'
              except Exception as exc:
                  entry.update({'status': 'exception', 'error': repr(exc), 'duration_seconds': round(time.time() - started, 3)})
              return entry, []

          results = []
          resolved = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as executor:
              future_map = {executor.submit(probe, endpoint): endpoint for endpoint in endpoints}
              for future in concurrent.futures.as_completed(future_map):
                  try:
                      entry, media = future.result()
                  except Exception as exc:
                      entry, media = {'endpoint': future_map[future], 'status': 'future_exception', 'error': repr(exc)}, []
                  results.append(entry)
                  if media:
                      resolved.append((entry['endpoint'], media))

          results.sort(key=lambda entry: endpoints.index(entry['endpoint']) if entry.get('endpoint') in endpoints else 999)
          # Remove any embedded media URLs from the committed probe report.
          clean_results = []
          for entry in results:
              clean = {k: v for k, v in entry.items() if k != 'media_candidates'}
              clean_results.append(clean)
          (root / 'piped-probes.json').write_text(json.dumps(clean_results, ensure_ascii=False, indent=2), encoding='utf-8')

          ffmpeg_attempts = []
          winner = None
          attempt_index = 0
          for endpoint, media_list in resolved:
              if winner:
                  break
              for media in media_list:
                  attempt_index += 1
                  media_url = media['url']
                  run_dir = raw_dir / f'run-{attempt_index:03d}'
                  run_dir.mkdir(parents=True, exist_ok=True)
                  patterns = [
                      ['-ss', str(start_s), '-i', media_url, '-t', str(end_s - start_s)],
                      ['-i', media_url, '-ss', str(start_s), '-t', str(end_s - start_s)],
                  ]
                  for mode_index, middle in enumerate(patterns, 1):
                      for child in run_dir.glob('frame-*.jpg'):
                          child.unlink()
                      command = [
                          'ffmpeg', '-hide_banner', '-y', '-loglevel', 'warning',
                          '-rw_timeout', '180000000',
                          '-user_agent', ua,
                          '-headers', f'Referer: {endpoint}/\r\nOrigin: {endpoint}\r\n',
                          *middle,
                          '-an', '-vf', "fps=1/15,scale='min(960,iw)':-2",
                          '-q:v', '3', str(run_dir / 'frame-%03d.jpg'),
                      ]
                      safe_command = ['<redacted-media-url>' if part == media_url else part for part in command]
                      started = time.time()
                      try:
                          completed = subprocess.run(command, text=True, capture_output=True, timeout=900)
                          paths = sorted(run_dir.glob('frame-*.jpg'))
                          attempt = {
                              'endpoint': endpoint,
                              'kind': media.get('kind'),
                              'quality': media.get('quality'),
                              'height': media.get('height'),
                              'videoOnly': media.get('videoOnly'),
                              'mode_index': mode_index,
                              'command': safe_command,
                              'returncode': completed.returncode,
                              'duration_seconds': round(time.time() - started, 3),
                              'frame_count': len(paths),
                              'stderr_tail': completed.stderr[-12000:].replace(media_url, '<redacted-media-url>'),
                          }
                          ffmpeg_attempts.append(attempt)
                          if completed.returncode == 0 and len(paths) >= 4:
                              winner = {'endpoint': endpoint, 'kind': media.get('kind'), 'quality': media.get('quality'), 'height': media.get('height'), 'run_dir': str(run_dir)}
                              break
                      except Exception as exc:
                          ffmpeg_attempts.append({
                              'endpoint': endpoint,
                              'kind': media.get('kind'),
                              'mode_index': mode_index,
                              'error': repr(exc),
                              'duration_seconds': round(time.time() - started, 3),
                          })
                  if winner:
                      break

          (root / 'ffmpeg-attempts.json').write_text(json.dumps(ffmpeg_attempts, ensure_ascii=False, indent=2), encoding='utf-8')

          selected = []
          if winner:
              raw_frames = sorted(Path(winner['run_dir']).glob('frame-*.jpg'))
              if len(raw_frames) <= 25:
                  keep = list(range(len(raw_frames)))
              else:
                  keep = sorted({round(i * (len(raw_frames) - 1) / 24) for i in range(25)})
              for output_index, source_index in enumerate(keep, 1):
                  source = raw_frames[source_index]
                  target = frames_dir / f'frame-{output_index:03d}.jpg'
                  image = Image.open(source).convert('RGB')
                  image.save(target, 'JPEG', quality=90, optimize=True)
                  second = start_s + source_index * 15
                  stat = ImageStat.Stat(image)
                  selected.append({
                      'file': target.name,
                      'source_second': second,
                      'source_timestamp': f'{second // 3600:02d}:{(second % 3600) // 60:02d}:{second % 60:02d}',
                      'bytes': target.stat().st_size,
                      'sha256': hashlib.sha256(target.read_bytes()).hexdigest(),
                      'width': image.width,
                      'height': image.height,
                      'mean_rgb': [round(value, 2) for value in stat.mean],
                      'stddev_rgb': [round(value, 2) for value in stat.stddev],
                  })

          hashes = {item['sha256'] for item in selected}
          result = {
              'status': 'actual_video_frames_captured' if len(selected) >= 4 and len(hashes) >= 2 else 'failed',
              'video_id': video_id,
              'source_url': source_url,
              'source_start_seconds': start_s,
              'source_end_seconds': end_s,
              'successful_api_count': sum(1 for item in clean_results if item.get('status') == 'api_success'),
              'winner': ({k: v for k, v in winner.items() if k != 'run_dir'} if winner else None),
              'selected_frame_count': len(selected),
              'unique_selected_hashes': len(hashes),
              'frames': selected,
          }
          (root / 'result.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')

          if selected:
              cols, thumb_w, thumb_h = 2, 640, 360
              rows = math.ceil(len(selected) / cols)
              sheet = Image.new('RGB', (cols * thumb_w, rows * thumb_h), 'white')
              draw = ImageDraw.Draw(sheet)
              for index, item in enumerate(selected):
                  image = Image.open(frames_dir / item['file']).convert('RGB')
                  image.thumbnail((thumb_w, thumb_h), Image.Resampling.LANCZOS)
                  canvas = Image.new('RGB', (thumb_w, thumb_h), 'black')
                  canvas.paste(image, ((thumb_w - image.width) // 2, (thumb_h - image.height) // 2))
                  x, y = (index % cols) * thumb_w, (index // cols) * thumb_h
                  sheet.paste(canvas, (x, y))
                  draw.rectangle((x + 7, y + 7, x + 140, y + 35), fill='black')
                  draw.text((x + 13, y + 13), item['source_timestamp'], fill='white')
              sheet.save(root / 'contact-sheet.jpg', 'JPEG', quality=90, optimize=True)

          # Remove transient directories and any unredacted stream URLs.
          for directory in raw_dir.glob('run-*'):
              if directory.is_dir():
                  for child in directory.iterdir():
                      child.unlink()
                  directory.rmdir()
          raw_dir.rmdir()
          PY
          python artifact/capture.py
          cat artifact/result.json
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('artifact')
          with zipfile.ZipFile(root / 'cpptx-youtube-piped-current-output.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob('*')):
                  if path.is_file() and path.name != 'cpptx-youtube-piped-current-output.zip':
                      archive.write(path, path.relative_to(root))
          PY
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpptx-youtube-piped-current-output
          path: artifact/
          if-no-files-found: error
          retention-days: 2
