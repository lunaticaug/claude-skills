name: Inspect YTCut public application API contract

on:
  push:
    branches:
      - tmp/cpptx-ytcut-inspect-20260804
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/cpptx-ytcut-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install requests beautifulsoup4
      - name: Download live app bundle and extract API strings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/assets
          cat > artifact/inspect.py <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          import requests
          from bs4 import BeautifulSoup

          root=Path('artifact');assets_dir=root/'assets';base='https://ytcut.org/'
          session=requests.Session();session.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36'})
          response=session.get(base,timeout=60);response.raise_for_status();html=response.text;(root/'index.html').write_text(html,encoding='utf-8')
          soup=BeautifulSoup(html,'html.parser');queue=[]
          for tag in soup.find_all(['script','link']):
              raw=tag.get('src') or tag.get('href')
              if not raw:continue
              url=urljoin(base,raw)
              if urlparse(url).netloc==urlparse(base).netloc and (url.endswith('.js') or '/_next/static/' in url or '/assets/' in url):
                  if url not in queue:queue.append(url)
          downloaded=[];all_text=[html]
          for index,url in enumerate(queue[:200],1):
              entry={'url':url}
              try:
                  r=session.get(url,timeout=60);entry.update({'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type')})
                  if r.status_code==200:
                      path=assets_dir/(Path(urlparse(url).path).name or f'asset-{index:03d}.js');path.write_bytes(r.content);entry['file']=path.name;all_text.append(r.text)
              except Exception as exc:entry['error']=repr(exc)
              downloaded.append(entry)
          text='\n'.join(all_text)
          tokens=['/api/','fetch(','axios','createTask','taskId','task_id','jobId','job_id','status','poll','downloadUrl','download_url','cut','clip','activity','server','direct','video-info','videoInfo','start_time','end_time','format','quality']
          windows=[];seen=set()
          for token in tokens:
              for match in re.finditer(re.escape(token),text,re.I):
                  lo=max(0,match.start()-1800);hi=min(len(text),match.end()+3200);window=text[lo:hi];digest=hash(window)
                  if digest in seen:continue
                  seen.add(digest);windows.append({'token':token,'window':window})
                  if len(windows)>=600:break
              if len(windows)>=600:break
          endpoints=[]
          patterns=[re.compile(r'''https?://[^"'`\\\s<>]{4,500}''',re.I),re.compile(r'''["'`](/[^"'`\s]{0,250}(?:api|task|job|status|download|clip|cut|video|activity)[^"'`\s]{0,250})["'`]''',re.I)]
          for pattern in patterns:
              for match in pattern.finditer(text):
                  value=match.group(1) if match.lastindex else match.group(0);value=value.replace('\\u0026','&').replace('\\/','/')
                  if value not in endpoints:endpoints.append(value)
          report={'base':base,'landing_status':response.status_code,'asset_count':len(downloaded),'assets':downloaded,'endpoint_candidates':endpoints[:3000],'window_count':len(windows)}
          (root/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'endpoints.txt').write_text('\n'.join(endpoints[:10000]),encoding='utf-8')
          (root/'code-windows.txt').write_text('\n\n===== TOKEN =====\n\n'.join(f"{item['token']}\n{item['window']}" for item in windows),encoding='utf-8')
          PY
          python artifact/inspect.py
          cat artifact/report.json
      - name: Upload inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpptx-ytcut-inspection
          path: artifact/
          if-no-files-found: error
          retention-days: 2
