name: Temporary cpptx YouTube segment capture

on:
  push:
    branches:
      - tmp/cpptx-youtube-7ux-23m-20260804
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/cpptx-youtube-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install capture tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade 'yt-dlp[default,curl-cffi]' requests
          ffmpeg -version | head -n 3
          yt-dlp --version

      - name: Capture 23:00-28:00 from the supplied public YouTube video
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifact/sample-frames
          URL='https://www.youtube.com/watch?v=7UXprjqSBvk'
          OUT='artifact/segment.%(ext)s'
          : > artifact/capture.log

          run_attempt() {
            local label="$1"
            shift
            echo "===== ${label} =====" | tee -a artifact/capture.log
            yt-dlp \
              --newline \
              --no-playlist \
              --download-sections '*00:23:00-00:28:00' \
              --force-keyframes-at-cuts \
              --format 'bestvideo[height<=720][ext=mp4]/bestvideo[height<=720]/best[height<=720]' \
              --output "$OUT" \
              "$@" \
              "$URL" 2>&1 | tee -a artifact/capture.log
            return ${PIPESTATUS[0]}
          }

          success=0
          run_attempt 'default extractor' && success=1
          if [[ $success -eq 0 ]]; then
            rm -f artifact/segment.* artifact/*.part
            run_attempt 'web safari client with browser impersonation' \
              --impersonate chrome \
              --extractor-args 'youtube:player_client=web_safari,web_embedded' && success=1
          fi
          if [[ $success -eq 0 ]]; then
            rm -f artifact/segment.* artifact/*.part
            run_attempt 'tv embedded and android vr clients' \
              --extractor-args 'youtube:player_client=tv_embedded,android_vr' && success=1
          fi

          if [[ $success -eq 0 ]]; then
            echo 'yt-dlp failed; trying public Piped API instances' | tee -a artifact/capture.log
            python - <<'PY' 2>&1 | tee -a artifact/capture.log
          import json
          import subprocess
          from pathlib import Path
          import requests

          video_id = '7UXprjqSBvk'
          endpoints = [
              'https://pipedapi.adminforge.de',
              'https://pipedapi.leptons.xyz',
              'https://pipedapi.kavin.rocks',
              'https://api.piped.yt',
          ]
          log = []
          for endpoint in endpoints:
              try:
                  response = requests.get(f'{endpoint}/streams/{video_id}', timeout=35)
                  response.raise_for_status()
                  payload = response.json()
                  streams = [s for s in payload.get('videoStreams', []) if s.get('url')]
                  def height(stream):
                      q = str(stream.get('quality') or '')
                      digits = ''.join(ch for ch in q if ch.isdigit())
                      return int(digits or 0)
                  candidates = [s for s in streams if 0 < height(s) <= 720]
                  if not candidates:
                      candidates = streams
                  candidates.sort(key=lambda s: (height(s), bool(s.get('videoOnly'))), reverse=True)
                  if not candidates:
                      raise RuntimeError('no video stream URLs returned')
                  stream = candidates[0]
                  Path('artifact/piped-stream.json').write_text(
                      json.dumps({'endpoint': endpoint, 'selected': stream}, ensure_ascii=False, indent=2),
                      encoding='utf-8',
                  )
                  command = [
                      'ffmpeg', '-y', '-ss', '1380', '-i', stream['url'], '-t', '300',
                      '-an', '-c:v', 'libx264', '-preset', 'veryfast', '-crf', '21',
                      '-pix_fmt', 'yuv420p', 'artifact/segment.mp4',
                  ]
                  completed = subprocess.run(command, text=True, capture_output=True, timeout=900)
                  Path('artifact/piped-ffmpeg.log').write_text(
                      completed.stdout + '\n' + completed.stderr, encoding='utf-8'
                  )
                  if completed.returncode == 0 and Path('artifact/segment.mp4').stat().st_size > 100_000:
                      log.append({'endpoint': endpoint, 'status': 'success'})
                      break
                  raise RuntimeError(f'ffmpeg failed with code {completed.returncode}')
              except Exception as exc:
                  log.append({'endpoint': endpoint, 'status': 'failed', 'error': repr(exc)})
          Path('artifact/piped-attempts.json').write_text(
              json.dumps(log, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          PY
          fi

          SEGMENT=$(find artifact -maxdepth 1 -type f \( -name 'segment.mp4' -o -name 'segment.webm' -o -name 'segment.mkv' \) -size +100k | head -n 1 || true)
          if [[ -n "$SEGMENT" ]]; then
            ffprobe -v error -show_format -show_streams -of json "$SEGMENT" > artifact/ffprobe.json
            ffmpeg -y -i "$SEGMENT" -vf 'fps=1/30' -q:v 2 artifact/sample-frames/frame-%03d.jpg > artifact/sample-frames.log 2>&1
            python - <<'PY'
          import json
          from pathlib import Path
          probe = json.loads(Path('artifact/ffprobe.json').read_text(encoding='utf-8'))
          video = next((s for s in probe.get('streams', []) if s.get('codec_type') == 'video'), {})
          result = {
              'status': 'captured',
              'video_id': '7UXprjqSBvk',
              'source_start_seconds': 1380,
              'source_end_seconds': 1680,
              'duration_seconds': float(probe.get('format', {}).get('duration') or 0),
              'width': video.get('width'),
              'height': video.get('height'),
              'codec': video.get('codec_name'),
              'segment_file': next(str(p) for p in Path('artifact').glob('segment.*') if p.stat().st_size > 100_000),
              'sample_frame_count': len(list(Path('artifact/sample-frames').glob('*.jpg'))),
          }
          Path('artifact/result.json').write_text(json.dumps(result, indent=2), encoding='utf-8')
          PY
          else
            python - <<'PY'
          import json
          from pathlib import Path
          Path('artifact/result.json').write_text(json.dumps({
              'status': 'failed',
              'video_id': '7UXprjqSBvk',
              'source_start_seconds': 1380,
              'source_end_seconds': 1680,
          }, indent=2), encoding='utf-8')
          PY
          fi

      - name: Upload capture artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpptx-youtube-7ux-23m
          path: artifact/
          if-no-files-found: error
          retention-days: 1
