name: Capture actual YouTube storyboard frames from 23:00

on:
  push:
    branches:
      - tmp/cpptx-youtube-innertube-storyboard-20260804
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/cpptx-youtube-innertube-storyboard.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pillow
      - name: Retrieve signed YouTube storyboard sheets and crop the 23:00 segment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/frames artifact/sheets
          cat > artifact/capture.py <<'PY'
          import hashlib
          import io
          import json
          import math
          import re
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from PIL import Image, ImageDraw, ImageStat

          root = Path('artifact')
          frames_dir = root / 'frames'
          sheets_dir = root / 'sheets'
          video_id = '7UXprjqSBvk'
          embed_referrer = 'https://www.pwc.com/kr/ko/events/event_260512.html'
          start_s, end_s, step_s = 1380, 1740, 15
          fallback_duration = 10175
          fallback_api_key = 'AIzaSyAO_FJ2SlqU8Q4STEHLGCilw_Y9_11qcW8'
          chrome_ua = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36'

          session = requests.Session()
          session.headers.update({
              'User-Agent': chrome_ua,
              'Accept-Language': 'ko-KR,ko;q=0.9,en-US;q=0.8,en;q=0.7',
              'Referer': embed_referrer,
          })
          session.cookies.update({
              'SOCS': 'CAI',
              'CONSENT': 'YES+cb.20260804-00-p0.ko+FX+999',
          })

          page_urls = [
              f'https://www.youtube.com/embed/{video_id}?start={start_s}&autoplay=0',
              f'https://www.youtube-nocookie.com/embed/{video_id}?start={start_s}&autoplay=0',
              f'https://www.youtube.com/watch?v={video_id}',
          ]
          pages = []
          api_key = None
          visitor_data = None
          client_version = None
          direct_specs = []
          duration_candidates = []

          string_patterns = {
              'api_key': [r'"INNERTUBE_API_KEY"\s*:\s*"([^"]+)"', r'INNERTUBE_API_KEY\\?"\s*:\s*\\?"([^"\\]+)'],
              'visitor_data': [r'"VISITOR_DATA"\s*:\s*"([^"]+)"'],
              'client_version': [r'"INNERTUBE_CLIENT_VERSION"\s*:\s*"([^"]+)"'],
              'storyboard_spec': [r'"playerStoryboardSpecRenderer"\s*:\s*\{\s*"spec"\s*:\s*"((?:\\.|[^"\\])*)"'],
              'length_seconds': [r'"lengthSeconds"\s*:\s*"(\d+)"'],
          }

          def decode_json_string(value):
              try:
                  return json.loads('"' + value + '"')
              except Exception:
                  return value.replace('\\u0026', '&').replace('\\/', '/')

          for page_index, page_url in enumerate(page_urls, 1):
              entry = {'page_index': page_index, 'url': page_url}
              try:
                  response = session.get(page_url, timeout=60)
                  text = response.text
                  entry.update({
                      'http_status': response.status_code,
                      'content_type': response.headers.get('content-type'),
                      'bytes': len(response.content),
                      'final_url': response.url,
                  })
                  (root / f'page-{page_index:02d}.html').write_text(text, encoding='utf-8')
                  for pattern in string_patterns['api_key']:
                      match = re.search(pattern, text)
                      if match and not api_key:
                          api_key = decode_json_string(match.group(1))
                          break
                  for pattern in string_patterns['visitor_data']:
                      match = re.search(pattern, text)
                      if match and not visitor_data:
                          visitor_data = decode_json_string(match.group(1))
                          break
                  for pattern in string_patterns['client_version']:
                      match = re.search(pattern, text)
                      if match and not client_version:
                          client_version = decode_json_string(match.group(1))
                          break
                  for pattern in string_patterns['storyboard_spec']:
                      for match in re.finditer(pattern, text):
                          spec = decode_json_string(match.group(1))
                          if spec and spec not in direct_specs:
                              direct_specs.append(spec)
                  for pattern in string_patterns['length_seconds']:
                      for match in re.finditer(pattern, text):
                          duration_candidates.append(int(match.group(1)))
                  entry.update({
                      'api_key_found': bool(api_key),
                      'visitor_data_found': bool(visitor_data),
                      'client_version_found': bool(client_version),
                      'direct_storyboard_spec_count': len(direct_specs),
                  })
              except Exception as exc:
                  entry['error'] = repr(exc)
              pages.append(entry)

          api_key = api_key or fallback_api_key
          client_version = client_version or '2.20260708.00.00'
          duration = max(duration_candidates) if duration_candidates else fallback_duration

          clients = [
              {
                  'label': 'web_embedded',
                  'header_name': '56',
                  'client': {
                      'clientName': 'WEB_EMBEDDED_PLAYER',
                      'clientVersion': client_version,
                      'hl': 'ko',
                      'gl': 'KR',
                      'userAgent': chrome_ua,
                  },
                  'thirdParty': {'embedUrl': embed_referrer},
                  'origin': 'https://www.pwc.com',
                  'referer': embed_referrer,
              },
              {
                  'label': 'web',
                  'header_name': '1',
                  'client': {
                      'clientName': 'WEB',
                      'clientVersion': client_version,
                      'hl': 'ko',
                      'gl': 'KR',
                      'userAgent': chrome_ua,
                  },
                  'origin': 'https://www.youtube.com',
                  'referer': f'https://www.youtube.com/watch?v={video_id}',
              },
              {
                  'label': 'tv',
                  'header_name': '7',
                  'client': {
                      'clientName': 'TVHTML5',
                      'clientVersion': '7.20260707.07.00',
                      'hl': 'ko',
                      'gl': 'KR',
                      'userAgent': 'Mozilla/5.0 (ChromiumStylePlatform) Cobalt/25.lts.30.1034943-gold (unlike Gecko)',
                  },
                  'origin': 'https://www.youtube.com',
                  'referer': f'https://www.youtube.com/tv#/watch?v={video_id}',
              },
              {
                  'label': 'android_vr',
                  'header_name': '28',
                  'client': {
                      'clientName': 'ANDROID_VR',
                      'clientVersion': '1.65.10',
                      'deviceMake': 'Oculus',
                      'deviceModel': 'Quest 3',
                      'androidSdkVersion': 32,
                      'userAgent': 'com.google.android.apps.youtube.vr.oculus/1.65.10 (Linux; U; Android 12L) gzip',
                      'osName': 'Android',
                      'osVersion': '12L',
                      'hl': 'ko',
                      'gl': 'KR',
                  },
                  'origin': 'https://www.youtube.com',
                  'referer': f'https://www.youtube.com/watch?v={video_id}',
              },
          ]

          api_attempts = []
          specs = list(direct_specs)
          player_metadata = []
          endpoint = f'https://www.youtube.com/youtubei/v1/player?key={api_key}&prettyPrint=false'

          for client_info in clients:
              context = {'client': client_info['client']}
              if client_info.get('thirdParty'):
                  context['thirdParty'] = client_info['thirdParty']
              payload = {
                  'context': context,
                  'videoId': video_id,
                  'contentCheckOk': True,
                  'racyCheckOk': True,
                  'playbackContext': {
                      'contentPlaybackContext': {
                          'html5Preference': 'HTML5_PREF_WANTS',
                      }
                  },
              }
              headers = {
                  'Content-Type': 'application/json',
                  'Origin': client_info['origin'],
                  'Referer': client_info['referer'],
                  'X-YouTube-Client-Name': client_info['header_name'],
                  'X-YouTube-Client-Version': client_info['client']['clientVersion'],
                  'User-Agent': client_info['client'].get('userAgent', chrome_ua),
              }
              if visitor_data:
                  headers['X-Goog-Visitor-Id'] = visitor_data
              entry = {'client': client_info['label']}
              try:
                  response = session.post(endpoint, headers=headers, json=payload, timeout=90)
                  entry.update({
                      'http_status': response.status_code,
                      'content_type': response.headers.get('content-type'),
                      'bytes': len(response.content),
                  })
                  data = response.json()
                  playability = data.get('playabilityStatus') or {}
                  details = data.get('videoDetails') or {}
                  spec = (((data.get('storyboards') or {}).get('playerStoryboardSpecRenderer') or {}).get('spec'))
                  entry.update({
                      'playability_status': playability.get('status'),
                      'playability_reason': playability.get('reason'),
                      'storyboard_spec_found': bool(spec),
                      'title': details.get('title'),
                      'length_seconds': details.get('lengthSeconds'),
                  })
                  if details.get('lengthSeconds'):
                      duration = int(details['lengthSeconds'])
                  if spec and spec not in specs:
                      specs.append(spec)
                  player_metadata.append({
                      'client': client_info['label'],
                      'playability_status': playability.get('status'),
                      'playability_reason': playability.get('reason'),
                      'title': details.get('title'),
                      'author': details.get('author'),
                      'length_seconds': details.get('lengthSeconds'),
                      'storyboard_spec_found': bool(spec),
                      'streaming_data_present': bool(data.get('streamingData')),
                  })
                  sanitized = {
                      'playabilityStatus': data.get('playabilityStatus'),
                      'videoDetails': data.get('videoDetails'),
                      'storyboards': {'spec_present': bool(spec)},
                      'streamingData': {'present': bool(data.get('streamingData'))},
                  }
                  (root / f'player-{client_info["label"]}.json').write_text(
                      json.dumps(sanitized, ensure_ascii=False, indent=2), encoding='utf-8'
                  )
              except Exception as exc:
                  entry['error'] = repr(exc)
              api_attempts.append(entry)

          def parse_spec(spec):
              pieces = spec.split('|')
              if len(pieces) < 2:
                  return []
              base_url = urljoin('https://i.ytimg.com/', pieces[0])
              levels = []
              for level_index, value in enumerate(pieces[1:]):
                  args = value.split('#')
                  if len(args) != 8:
                      continue
                  try:
                      width, height, frame_count, cols, rows = map(int, args[:5])
                      interval_ms = int(args[5])
                  except Exception:
                      continue
                  N, sigh = args[6], args[7]
                  url_template = base_url.replace('$L', str(level_index)).replace('$N', N) + f'&sigh={sigh}'
                  levels.append({
                      'level_index': level_index,
                      'width': width,
                      'height': height,
                      'frame_count': frame_count,
                      'cols': cols,
                      'rows': rows,
                      'interval_ms': interval_ms,
                      'url_template': url_template,
                  })
              return levels

          all_levels = []
          for spec_index, spec in enumerate(specs, 1):
              for level in parse_spec(spec):
                  level['spec_index'] = spec_index
                  all_levels.append(level)

          # Prefer the largest cells, then the densest timeline.
          usable_levels = [level for level in all_levels if level['frame_count'] > 0 and level['cols'] > 0 and level['rows'] > 0]
          selected_level = max(
              usable_levels,
              key=lambda item: (item['width'] * item['height'], item['frame_count']),
              default=None,
          )

          sheet_cache = {}
          frame_records = []
          if selected_level:
              interval_s = selected_level['interval_ms'] / 1000 if selected_level['interval_ms'] > 0 else duration / selected_level['frame_count']
              per_sheet = selected_level['cols'] * selected_level['rows']
              for output_index, second in enumerate(range(start_s, end_s + 1, step_s), 1):
                  frame_index = min(max(int(second / interval_s), 0), selected_level['frame_count'] - 1)
                  sheet_index = frame_index // per_sheet
                  position = frame_index % per_sheet
                  sheet_url = selected_level['url_template'].replace('$M', str(sheet_index))
                  record = {
                      'output_index': output_index,
                      'source_second': second,
                      'source_timestamp': f'{second // 3600:02d}:{(second % 3600) // 60:02d}:{second % 60:02d}',
                      'storyboard_frame_index': frame_index,
                      'sheet_index': sheet_index,
                      'position': position,
                  }
                  try:
                      if sheet_index not in sheet_cache:
                          response = session.get(sheet_url, headers={
                              'User-Agent': chrome_ua,
                              'Referer': 'https://www.youtube.com/',
                          }, timeout=60)
                          response.raise_for_status()
                          sheet_image = Image.open(io.BytesIO(response.content)).convert('RGB')
                          sheet_cache[sheet_index] = sheet_image
                          safe_sheet = sheets_dir / f'sheet-{sheet_index:03d}.jpg'
                          sheet_image.save(safe_sheet, 'JPEG', quality=92, optimize=True)
                      sheet_image = sheet_cache[sheet_index]
                      col = position % selected_level['cols']
                      row = position // selected_level['cols']
                      left = col * selected_level['width']
                      top = row * selected_level['height']
                      crop = sheet_image.crop((
                          left,
                          top,
                          left + selected_level['width'],
                          top + selected_level['height'],
                      ))
                      scale = max(1, round(960 / max(crop.width, 1)))
                      crop = crop.resize((crop.width * scale, crop.height * scale), Image.Resampling.LANCZOS)
                      target = frames_dir / f'frame-{output_index:03d}-{second:05d}s.jpg'
                      crop.save(target, 'JPEG', quality=94, optimize=True)
                      stat = ImageStat.Stat(crop)
                      record.update({
                          'status': 'captured',
                          'file': target.name,
                          'bytes': target.stat().st_size,
                          'sha256': hashlib.sha256(target.read_bytes()).hexdigest(),
                          'width': crop.width,
                          'height': crop.height,
                          'mean_rgb': [round(value, 2) for value in stat.mean],
                          'stddev_rgb': [round(value, 2) for value in stat.stddev],
                      })
                  except Exception as exc:
                      record.update({'status': 'failed', 'error': repr(exc)})
                  frame_records.append(record)

          captured = [item for item in frame_records if item.get('status') == 'captured']
          unique_hashes = {item['sha256'] for item in captured}

          if captured:
              cols, thumb_w, thumb_h = 2, 640, 360
              rows = math.ceil(len(captured) / cols)
              sheet = Image.new('RGB', (cols * thumb_w, rows * thumb_h), 'white')
              draw = ImageDraw.Draw(sheet)
              for index, item in enumerate(captured):
                  image = Image.open(frames_dir / item['file']).convert('RGB')
                  image.thumbnail((thumb_w, thumb_h), Image.Resampling.LANCZOS)
                  canvas = Image.new('RGB', (thumb_w, thumb_h), 'black')
                  canvas.paste(image, ((thumb_w - image.width) // 2, (thumb_h - image.height) // 2))
                  x, y = (index % cols) * thumb_w, (index // cols) * thumb_h
                  sheet.paste(canvas, (x, y))
                  draw.rectangle((x + 7, y + 7, x + 140, y + 35), fill='black')
                  draw.text((x + 13, y + 13), item['source_timestamp'], fill='white')
              sheet.save(root / 'contact-sheet.jpg', 'JPEG', quality=90, optimize=True)

          result = {
              'status': 'actual_storyboard_frames_captured' if len(captured) >= 4 and len(unique_hashes) >= 2 else 'failed',
              'video_id': video_id,
              'source_url': f'https://www.youtube.com/watch?v={video_id}',
              'source_start_seconds': start_s,
              'source_end_seconds': end_s,
              'step_seconds': step_s,
              'duration_seconds': duration,
              'page_attempts': pages,
              'api_attempts': api_attempts,
              'player_metadata': player_metadata,
              'storyboard_spec_count': len(specs),
              'available_levels': [
                  {k: v for k, v in level.items() if k != 'url_template'} for level in all_levels
              ],
              'selected_level': (
                  {k: v for k, v in selected_level.items() if k != 'url_template'} if selected_level else None
              ),
              'captured_frame_count': len(captured),
              'unique_frame_hashes': len(unique_hashes),
              'frames': frame_records,
          }
          (root / 'result.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')

          # Raw YouTube pages can contain expiring tokens and are not needed in the delivered artifact.
          for path in root.glob('page-*.html'):
              path.unlink()
          PY
          python artifact/capture.py
          cat artifact/result.json
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('artifact')
          with zipfile.ZipFile(root / 'cpptx-youtube-innertube-storyboard-output.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob('*')):
                  if path.is_file() and path.name != 'cpptx-youtube-innertube-storyboard-output.zip':
                      archive.write(path, path.relative_to(root))
          PY
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpptx-youtube-innertube-storyboard-output
          path: artifact/
          if-no-files-found: error
          retention-days: 2
